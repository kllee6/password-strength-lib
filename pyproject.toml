[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "password-strength-lib"
version = "0.1.0"
description = "Pure-function password strength scoring, standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kllee6" }]

[tool.setuptools.packages.find]
include = ["password_strength*"]
